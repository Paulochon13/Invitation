<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Invitation resto</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&display=swap">
<style>
/* Layout: une invitation plein écran, une question par écran, texte aligné à gauche, boutons en bas. */
:root {
  --bg: #f3ece6;
  --fg: #2a1418;
  --muted: #7a5a5e;
  --accent: #d62f3f;
  --accent-fg: #fff7f4;
  --jade: #1f6f5c;
  --jade-fg: #f2fbf7;
  --line: #e2d3cb;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a0f12; --fg: #f5e9e4; --muted: #b89a9d; --accent: #ff6b74; --accent-fg: #2a0b0f;
    --jade: #5cc7a6; --jade-fg: #08201a; --line: #38242a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a0f12; --fg: #f5e9e4; --muted: #b89a9d; --accent: #ff6b74; --accent-fg: #2a0b0f;
  --jade: #5cc7a6; --jade-fg: #08201a; --line: #38242a; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
  overflow-x: hidden;
}
.stage { max-width: 34rem; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 28px; }
.dots { display: flex; gap: 8px; }
.dots i { width: 28px; height: 4px; border-radius: 2px; background: var(--line); transition: background .3s; }
.dots i.on { background: var(--accent); }
.slide { flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; min-width: 0; animation: rise .45s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .slide { animation: none; } }
.eyebrow { font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2.6rem, 11vw, 4.2rem); line-height: 1.02; letter-spacing: -0.02em; margin: 12px 0 0; text-wrap: balance; }
h1 em { font-style: normal; color: var(--accent); }
.lead { color: var(--muted); margin: 16px 0 0; max-width: 28ch; }
.actions { position: relative; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; min-height: 4rem; }
button { font: inherit; cursor: pointer; border: 0; border-radius: 999px; padding: 16px 32px; font-weight: 600; font-size: 1.05rem; }
button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.yes { background: var(--accent); color: var(--accent-fg); transform-origin: left center; transition: transform .25s ease; }
.no { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 2px var(--line); transition: transform .28s cubic-bezier(.3,1.4,.5,1); }
.choices { display: grid; gap: 14px; }
.choice { text-align: left; display: flex; flex-direction: column; gap: 4px; border-radius: 22px; padding: 22px 24px; width: 100%; }
.choice span { font-family: var(--display); font-weight: 800; font-size: 1.9rem; line-height: 1.1; }
.choice small { font-size: 0.95rem; font-weight: 400; opacity: 0.85; }
.thai { background: var(--jade); color: var(--jade-fg); }
.korean { background: var(--accent); color: var(--accent-fg); }
.choice:active { transform: scale(0.98); }
.when { display: flex; gap: 12px; flex-wrap: wrap; }
.when b { font-family: var(--display); font-weight: 800; font-size: 1rem; padding: 10px 18px; border-radius: 999px; background: var(--jade); color: var(--jade-fg); }
.when b + b { background: var(--accent); color: var(--accent-fg); }
.pick { color: var(--muted); margin: 0; }
</style>

<main class="stage">
  <div class="dots" aria-hidden="true"><i class="on"></i><i></i><i></i></div>

  <section class="slide" id="s1">
    <div>
      <div class="eyebrow">Une invitation</div>
      <h1>Veux-tu aller au <em>resto</em> avec moi&nbsp;?</h1>
    </div>
    <div class="actions" id="actions">
      <button class="yes" id="yes" type="button">Oui</button>
      <button class="no" id="no" type="button">Non</button>
    </div>
  </section>

  <section class="slide" id="s2" hidden>
    <div>
      <div class="eyebrow">Au menu</div>
      <h1>Thaï ou <em>coréen</em>&nbsp;?</h1>
      <p class="lead">Choisis ce qui te fait le plus envie.</p>
    </div>
    <div class="choices">
      <button class="choice thai" type="button" data-pick="thaï"><span>Thaï</span><small>Pad thaï, curry vert, mangue sticky rice</small></button>
      <button class="choice korean" type="button" data-pick="coréen"><span>Coréen</span><small>Bibimbap, barbecue, poulet frit</small></button>
    </div>
  </section>

  <section class="slide" id="s3" hidden>
    <div>
      <div class="eyebrow">Réservé</div>
      <h1>C’est noté, rdv <em>samedi soir</em> à 20h</h1>
      <p class="pick" id="pick"></p>
    </div>
    <div class="when"><b>Samedi</b><b>20h</b></div>
  </section>
</main>

<script>
(function () {
  var slides = [document.getElementById('s1'), document.getElementById('s2'), document.getElementById('s3')];
  var dots = document.querySelectorAll('.dots i');
  var yes = document.getElementById('yes');
  var no = document.getElementById('no');
  var tx = 0, ty = 0, tries = 0;
  var labels = ['Non', 'Vraiment ?', 'Réfléchis…', 'Allez !', 'Pas possible'];

  function show(n) {
    slides.forEach(function (s, i) { s.hidden = i !== n; });
    dots.forEach(function (d, i) { d.className = i <= n ? 'on' : ''; });
    window.scrollTo(0, 0);
  }

  function dodge(e) {
    if (e) e.preventDefault();
    var r = no.getBoundingClientRect();
    var w = window.innerWidth, h = window.innerHeight;
    var x = 16 + Math.random() * Math.max(0, w - r.width - 32);
    var y = 70 + Math.random() * Math.max(0, h - r.height - 100);
    tx += x - r.left;
    ty += y - r.top;
    no.style.transform = 'translate(' + tx + 'px,' + ty + 'px)';
    tries += 1;
    no.textContent = labels[Math.min(tries, labels.length - 1)];
    yes.style.transform = 'scale(' + Math.min(1 + tries * 0.07, 1.35) + ')';
  }

  no.addEventListener('pointerenter', dodge);
  no.addEventListener('pointerdown', dodge);
  no.addEventListener('click', dodge);

  yes.addEventListener('click', function () { show(1); });

  document.querySelectorAll('.choice').forEach(function (b) {
    b.addEventListener('click', function () {
      document.getElementById('pick').textContent = 'Ce sera ' + (b.dataset.pick === 'thaï' ? 'thaï' : 'coréen') + '.';
      show(2);
    });
  });
})();
</script>

</body></html>
